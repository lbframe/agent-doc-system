# Drift gate. The graph is a build artifact: compile it, then prove the
# committed one is byte-identical to a fresh compile. A stale or hand-edited
# graph fails here, not in someone's review three weeks later.
name: agentdoc
on:
  pull_request:
  push:
    branches: [main]
jobs:
  agentdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install the agentdoc CLI
        run: npm install -g github:lbframe/agent-doc-system
      - name: Validate and compile
        run: |
          agentdoc validate
          agentdoc compile
          agentdoc check
      - name: Reject dirty sources
        run: agentdoc check --require-clean
      - name: Routing evaluation
        run: agentdoc eval routing
