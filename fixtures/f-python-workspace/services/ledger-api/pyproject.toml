[project]
name = "ledger-api"
version = "0.1.0"
description = """
Serves the ledger read API.
"""
requires-python = ">=3.11"
readme = 'README.md'
dependencies = [
  "ledger-core",
  "fastapi>=0.110",
  "sqlalchemy>=2; python_version >= '3.11'",
  "psycopg[binary]>=3.1",
  "redis",
  "boto3",
]

[project.scripts]
ledger-api = "ledger_api.main:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff",
  "mypy",
  "ledger-testing",
]

[tool.uv.sources]
ledger-core = { workspace = true }
ledger-testing = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
