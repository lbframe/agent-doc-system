apiVersion: agentdoc.dev/config/v1
namespace: default
discovery:
  componentDescriptorName: agentdoc.yaml
  componentDescriptors:
    - backend/**/agentdoc.yaml
    - frontend/**/agentdoc.yaml
    - shared/**/agentdoc.yaml
    - edge/**/agentdoc.yaml
  centralDescriptors:
    - agentdoc/domains.yaml
    - agentdoc/systems.yaml
    - agentdoc/apis.yaml
    - agentdoc/resources.yaml
  journeyDefinitions: agentdoc/journeys.yaml
  contractRoots:
    - wire
  eventPatternPrefixes:
    - corp.
  eventContracts:
    - path: shared/index.js
      consumer: component:default/console
      format: code
  notUnitRoots:
    - agentdoc
    - docs
    - legacy-docs
    - tooling
    - scripts
    - .github
adapters:
  - node
  - pnpm
  - typescript
  - go
  - openapi
  - dockerfile
  - wrangler
  - database
  - events
  - github-actions
  - cache
authority:
  rules:
    - id: deployed-schedule-is-runtime-truth
      keyPattern: " schedule\\."
      elect: [OBSERVED_RUNTIME]
      rationale: "The committed manifest states intent; only the live scheduler states what fires."
      reviewWhen: "Review when the scheduler configuration changes."
    - id: placement-is-an-ownership-decision
      keyPattern: " placement\\."
      elect: [AUTHORED, REVIEWED_OVERRIDE]
      rationale: "Placement is a human ownership decision; no extractor can discover it."
      reviewWhen: "Review when ownership of a component moves."
reviewedOverrides: []
warningAcceptances: []
output:
  graph: .agentdoc/graph.json
  observations: agentdoc/observations
