syntax = "proto3";

package ledger;

service LedgerService {
  rpc GetEntry(GetEntryRequest) returns (Entry);
  rpc AppendEntry(AppendEntryRequest) returns (AppendEntryResponse);
}

message GetEntryRequest { string id = 1; }
message Entry { string id = 1; int64 amount_cents = 2; }
message AppendEntryRequest { Entry entry = 1; }
message AppendEntryResponse { string id = 1; }
