# Drift gate. The graph is a build artifact: compile it, then prove the
# committed one is byte-identical to a fresh compile. A stale or hand-edited
# graph fails here, not in someone's review three weeks later.
#
# This is the workflow `agentdoc init` installs as
# .github/workflows/agentdoc.yml (see templates/ci.yml). It assumes nothing
# about the repository beyond a supported Node toolchain.
name: agentdoc
on:
  pull_request:
  push:
    branches: [main]
jobs:
  agentdoc:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Install the agentdoc CLI
        # Unpinned tracks main. For CI reproducibility pin a tag or commit:
        #   github:lbframe/agent-doc-system#v1.0.0
        # A compiler upgrade intentionally invalidates committed graphs.
        run: npm install -g github:lbframe/agent-doc-system
      - name: Validate and compile
        run: |
          agentdoc validate
          agentdoc compile
          agentdoc check
      - name: Reject dirty sources
        run: agentdoc check --require-clean
      - name: Routing evaluation
        run: agentdoc eval routing
