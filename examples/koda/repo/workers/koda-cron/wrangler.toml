name = "koda-cron"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 3 * * *"]

[vars]
DIGEST_CRON_URL = "https://internal.example.org/api/internal/notifications/digest-flush"
PENDING_APPROVAL_CRON_URL = "https://internal.example.org/api/internal/calendar/pending-approval"

[[kv_namespaces]]
binding = "CRON_STATE"
id = "0000000000000000000000000000000f"

[[services]]
binding = "TEACHER"
service = "teacher-service"
