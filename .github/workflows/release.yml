# Release agent-doc-system to npm, tag it and create the GitHub release.
#
# Manual only: this workflow has no trigger besides workflow_dispatch, and it
# never commits, bumps or edits files. The version is already on main, set by
# a reviewed release PR (see RELEASING.md); `version` is a typed confirmation.
#
#   gh workflow run release.yml -f version=X.Y.Z -f dry_run=true
#   gh workflow run release.yml -f version=X.Y.Z
#
# npm authenticates with trusted publishing (OIDC) and publishes with
# provenance; no npm token exists anywhere. Every step after the gates is
# idempotent, so a run that failed partway can be re-run as is.
name: release
run-name: "release ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.0 (no "v"). Must equal package.json on main.'
        required: true
        type: string
      dry_run:
        description: 'Dry run: every guard and gate plus npm publish --dry-run; nothing is published, tagged or released.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# One release run at a time; a second dispatch waits (never cancels a run).
# The publish job also holds the `release` group.
concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  guards:
    name: Guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      npm_state: ${{ steps.preflight.outputs.npm_state }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Ref, version, changelog, graphs, tag and npm guards
        id: preflight
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release/guards.mjs preflight
      - name: Release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release/changelog-notes.mjs "$RELEASE_VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/v$RELEASE_VERSION" > "$notes"
          cat "$notes"
          { printf '## AgentDoc v%s: release notes\n\n' "$RELEASE_VERSION"; cat "$notes"; } >> "$GITHUB_STEP_SUMMARY"

  # The full CI, on the exact commit being released (reusable ci.yml).
  ci:
    name: CI
    needs: guards
    permissions:
      contents: read
    # `./` resolves at the dispatched commit before any job runs. actionlint
    # does not accept the newer `$/` self-repository syntax yet.
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository]

  dry-run:
    name: Publish (dry run)
    needs: [guards, ci]
    if: inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1 and setup-node may bundle an
      # older one: install an exact version, then assert the minimum.
      - name: npm CLI for trusted publishing
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global npm@11.21.2
          npm --version
          node scripts/release/guards.mjs npm-cli
      - name: No npm token in the environment
        run: node scripts/release/guards.mjs env
      - name: npm publish --dry-run
        env:
          NPM_STATE: ${{ needs.guards.outputs.npm_state }}
        run: |
          if [ "$NPM_STATE" = published-same ]; then
            echo "::notice::already on npm from this commit; a real run would skip the publish"
          else
            npm publish --dry-run --access public --provenance
          fi

  publish:
    name: Publish, tag and release
    needs: [guards, ci]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      # Trusted publishing needs npm >= 11.5.1 and setup-node may bundle an
      # older one: install an exact version, then assert the minimum.
      - name: npm CLI for trusted publishing
        run: | # zizmor: ignore[adhoc-packages]
          npm install --global npm@11.21.2
          npm --version
          node scripts/release/guards.mjs npm-cli
      - name: No npm token in the environment
        run: node scripts/release/guards.mjs env
      # Checked again here rather than taken from the guards job: a re-run of
      # this job alone must see what an earlier attempt already did.
      - name: Ref, version, changelog, graphs, tag and npm guards
        id: state
        run: node scripts/release/guards.mjs preflight

      - name: 1. Publish to npm
        if: steps.state.outputs.npm_state == 'absent'
        run: npm publish --access public --provenance
      - name: 1. Publish to npm (already published from this commit)
        if: steps.state.outputs.npm_state == 'published-same'
        run: echo "::notice::agent-doc-system@$RELEASE_VERSION is already on npm from $GITHUB_SHA; skipping"

      - name: 2. Annotated tag on this commit
        if: steps.state.outputs.tag_state == 'absent'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="v$RELEASE_VERSION" -f message="AgentDoc v$RELEASE_VERSION" \
            -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$RELEASE_VERSION" -f sha="$tag_sha" --silent
          node scripts/release/guards.mjs tag
      - name: 2. Tag (already on this commit)
        if: steps.state.outputs.tag_state == 'same'
        run: echo "::notice::tag v$RELEASE_VERSION already points at $GITHUB_SHA; skipping"

      - name: 3. GitHub release, marked latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$RELEASE_VERSION"
          notes="$RUNNER_TEMP/notes.md"
          node scripts/release/changelog-notes.mjs "$RELEASE_VERSION" \
            --base-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$tag" > "$notes"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --title "AgentDoc $tag" \
              --notes-file "$notes" --draft=false --latest
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "AgentDoc $tag" \
              --notes-file "$notes" --latest
          fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest" = "$tag" || { echo "::error::latest release is $latest, expected $tag"; exit 1; }
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url --jq .url
