# CI for the agent-doc-system repository itself.
#
# Matrix job: the test suite, CLI smoke and the clean npm-pack install test run
# on every supported Node version. A separate job runs the heavyweight
# aggregate evaluation once — triplicating it would triple the cost without
# adding signal.
#
# Also reusable (workflow_call): release.yml runs this exact CI as the gate
# before it publishes.
name: ci
# No concurrency group on purpose: it would also apply inside release runs
# (workflow_call), where the gate must never be queued behind or cancelled by
# an unrelated CI run. Every run completes; jobs are short and read-only.
on: # zizmor: ignore[concurrency-limits]
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
# The job ids are the check names ("test (22)", "eval"); no `name:` keeps them.
jobs:
  test: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci
      - name: CLI smoke
        run: |
          node bin/agentdoc.mjs --version
          node bin/agentdoc.mjs --help
          node bin/agentdoc.mjs doctor
      - name: Tests (unit, adversarial, modes, packaging incl. npm pack install)
        run: node --test tests/*.test.mjs
  eval: # zizmor: ignore[anonymous-definition]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npm ci
      - name: Aggregate routing evaluation
        run: node evals/run-all.mjs
      - name: Corpora gates
        run: |
          set -e
          for repo in fixtures/a-node-ts-postgres fixtures/b-go-multi-service fixtures/c-alt-monorepo fixtures/e-rust-workspace fixtures/f-python-workspace examples/koda/repo; do
            echo "=== $repo ==="
            (cd "$repo" \
              && node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" validate \
              && node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" compile \
              && node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" check --require-clean)
          done
      - name: Determinism — three compiles are byte-identical
        run: |
          set -e
          cd examples/koda/repo
          node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" compile >/dev/null
          h1=$(shasum -a 256 .agentdoc/graph.json | cut -d' ' -f1)
          node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" compile >/dev/null
          h2=$(shasum -a 256 .agentdoc/graph.json | cut -d' ' -f1)
          node "$GITHUB_WORKSPACE/bin/agentdoc.mjs" compile >/dev/null
          h3=$(shasum -a 256 .agentdoc/graph.json | cut -d' ' -f1)
          test "$h1" = "$h2" && test "$h2" = "$h3"
          echo "byte-identical across three compiles: $h1"
